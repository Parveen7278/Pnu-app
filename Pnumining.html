<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNU — Pennu Mining</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg-deep:#0B0E12;
  --bg-panel:#151A20;
  --bg-panel-raised:#1B222A;
  --line:#262E37;
  --gold:#F2B705;
  --gold-dim:#7A5F0A;
  --teal:#17D9AB;
  --text-main:#E7ECF1;
  --text-mute:#8B96A3;
  --danger:#E5533D;
  --radius:14px;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% -10%, rgba(242,183,5,0.08), transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(23,217,171,0.06), transparent 40%),
    var(--bg-deep);
  color:var(--text-main);
  font-family:'Inter', sans-serif;
  display:flex;
  justify-content:center;
  padding:28px 14px;
}

.app-frame{
  width:100%;
  max-width:420px;
  background:var(--bg-panel);
  border:1px solid var(--line);
  border-radius:26px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-height:760px;
  box-shadow:0 30px 60px rgba(0,0,0,0.5);
}

/* ---------- TOP BAR ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 18px 14px;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(145deg, var(--gold), #B8890A);
  color:#1a1400;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;font-size:18px;
  display:flex;align-items:center;justify-content:center;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:0.5px;}
.brand-sub{font-size:11px;color:var(--text-mute);}
.uid-chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--text-mute);
  background:var(--bg-panel-raised);
  border:1px solid var(--line);
  padding:5px 9px;border-radius:20px;
}

/* ---------- SCREENS ---------- */
.screen-container{flex:1;position:relative;overflow:hidden;}
.screen{
  display:none;
  flex-direction:column;
  gap:16px;
  padding:22px 20px 20px;
  animation:fadeIn .25s ease;
}
.screen.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.screen-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:21px;margin:0;
}
.screen-desc{
  margin:-10px 0 0;
  font-size:13px;
  color:var(--text-mute);
  line-height:1.5;
}

/* ---------- MINE SCREEN ---------- */
.rig{display:flex;flex-direction:column;align-items:center;padding:12px 0 4px;gap:12px;}

.token-circle{
  width:190px;height:190px;border-radius:50%;
  overflow:hidden;
  border:1px solid var(--line);
  cursor:pointer;
  outline:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .1s ease;
}
.token-circle:active{transform:scale(0.94);}
.token-img{
  width:100%;height:100%;
  object-fit:cover;
  transform:scale(1.0);
  display:block;
}
.token-circle.pumping{animation:pump 1.5s ease-in-out infinite;}
@keyframes pump{
  0%{ transform:scale(1); box-shadow:0 0 18px rgba(236,72,153,0.5); }
  50%{ transform:scale(1.055); box-shadow:0 0 42px rgba(236,72,153,0.95); }
  100%{ transform:scale(1); box-shadow:0 0 18px rgba(236,72,153,0.5); }
}

.rate-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:17px;font-weight:600;color:#ec4899;
  text-align:center;
}
.rig-unit{font-size:12px;color:var(--text-mute);letter-spacing:1px;font-weight:500;}

.btn-primary{
  background:linear-gradient(135deg, var(--gold), #C89305);
  color:#1a1400;
  border:none;
  padding:14px;
  border-radius:12px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;font-size:15px;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn-primary:active{transform:scale(0.98);}
.btn-primary.mining{background:linear-gradient(135deg, var(--teal), #0EA383); color:#04211a;}

.ad-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.btn-ghost{
  flex:1;
  background:var(--bg-panel-raised);
  border:1px solid var(--line);
  color:var(--text-main);
  padding:11px 12px;
  border-radius:12px;
  font-size:13px;font-weight:500;
  cursor:pointer;
  font-family:'Inter',sans-serif;
}
.btn-ghost:hover{border-color:var(--gold-dim);}
.ad-timer{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal);min-width:34px;text-align:right;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-grid.two{grid-template-columns:1fr 1fr;}
.stat-card{
  background:var(--bg-panel-raised);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 13px;
  display:flex;flex-direction:column;gap:5px;
}
.stat-label{font-size:11px;color:var(--text-mute);}
.stat-value{
  font-family:'IBM Plex Mono',monospace;
  font-size:15px;font-weight:600;
}

.footnote{
  font-size:11.5px;color:var(--text-mute);
  border-top:1px dashed var(--line);
  padding-top:12px;line-height:1.5;
  margin:2px 0 0;
}

/* ---------- WALLET / REFER shared ---------- */
.id-card, .balance-card, .supply-total{
  background:var(--bg-panel-raised);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 16px;
}
.id-card-label, .balance-label, .supply-total-label{
  display:block;font-size:11px;color:var(--text-mute);margin-bottom:6px;
}
.id-card-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.id-card-value{
  font-family:'IBM Plex Mono',monospace;font-size:13px;
  word-break:break-all;
}
.btn-copy{
  background:none;border:1px solid var(--line);color:var(--text-mute);
  padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;flex-shrink:0;
}
.balance-value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--gold);}
.wallet-status{font-size:12px;color:var(--text-mute);text-align:center;margin:-6px 0 0;}

/* ---------- TOKENOMICS ---------- */
.supply-total{display:flex;flex-direction:column;align-items:flex-start;}
.supply-total-value{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--text-main);}

.alloc-bar{
  display:flex;height:14px;border-radius:8px;overflow:hidden;border:1px solid var(--line);
}
.alloc-seg{height:100%;}
.seg-mine{background:var(--teal);}
.seg-team{background:var(--gold);}

.alloc-list{display:flex;flex-direction:column;gap:12px;}
.alloc-item{display:flex;gap:12px;align-items:flex-start;}
.alloc-dot{width:11px;height:11px;border-radius:3px;margin-top:4px;flex-shrink:0;}
.alloc-text{display:flex;flex-direction:column;gap:3px;}
.alloc-name{font-weight:600;font-size:13.5px;}
.alloc-desc{font-size:12px;color:var(--text-mute);line-height:1.5;}

/* ---------- BOTTOM NAV ---------- */
.bottom-nav{
  display:flex;
  border-top:1px solid var(--line);
  background:var(--bg-panel);
}
.nav-btn{
  flex:1;
  background:none;border:none;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:11px 0 13px;
  color:var(--text-mute);
  cursor:pointer;
  font-family:'Inter',sans-serif;font-size:10.5px;
}
.nav-btn svg{
  width:20px;height:20px;
  fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;
}
.nav-btn.active{color:var(--gold);}

/* ---------- TOAST ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--bg-panel-raised);
  border:1px solid var(--line);
  color:var(--text-main);
  padding:10px 18px;border-radius:24px;
  font-size:13px;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
  z-index:10;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:420px){
  body{padding:0;}
  .app-frame{border-radius:0;min-height:100vh;}
}
