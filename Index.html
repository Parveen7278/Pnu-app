<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PNU Network - Decentralized Cloud Mining</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at top, #1b072b 0%, #08020d 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            margin-top: 5px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff2a85, #ff7300, #ff2a85);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 42, 133, 0.4);
        }
        .header p {
            font-size: 11px;
            color: #9d8ba8;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 3px;
        }
        .mining-core {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(255, 42, 133, 0.6);
            box-shadow: 0 0 30px rgba(255, 42, 133, 0.3);
            animation: rotateClockwise 12s linear infinite;
        }
        .glow-circle {
            position: absolute;
            width: 135px;
            height: 135px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 42, 133, 0.25) 0%, rgba(255, 42, 133, 0) 70%);
            box-shadow: 0 0 25px rgba(255, 42, 133, 0.5);
            animation: pulseCore 2.5s infinite ease-in-out;
        }
        .pnu-svg-logo {
            width: 95px;
            height: 95px;
            z-index: 2;
            filter: drop-shadow(0 0 12px #ff2a85);
        }
        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseCore {
            0%, 100% { transform: scale(0.96); opacity: 0.8; }
            50% { transform: scale(1.06); opacity: 1; }
        }
        .balance-board {
            width: 100%;
            max-width: 380px;
            background: rgba(26, 12, 40, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 42, 133, 0.25);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 15px;
        }
        .balance-label {
            font-size: 12px;
            color: #b5a2c2;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .balance-num {
            font-size: 34px;
            font-weight: 800;
            color: #ffffff;
            margin: 6px 0;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 15px rgba(255, 42, 133, 0.7);
        }
        .balance-sub {
            font-size: 13px;
            color: #ff2a85;
            font-weight: 600;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .stat-card {
            background: rgba(14, 6, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px;
            text-align: left;
        }
        .stat-card span {
            font-size: 10px;
            color: #8c799c;
            display: block;
            text-transform: uppercase;
        }
        .stat-card strong {
            font-size: 13px;
            color: #00ffcc;
            margin-top: 2px;
            display: block;
        }
        .progress-box {
            width: 100%;
            max-width: 380px;
            background: rgba(26, 12, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 18px;
        }
        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #9d8ba8;
            margin-bottom: 6px;
        }
        .progress-track {
            width: 100%;
            height: 7px;
            background: #12061e;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 48.6%;
            background: linear-gradient(90deg, #ff2a85, #ff7300);
            border-radius: 10px;
        }
        .action-group {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .btn-boost {
            background: linear-gradient(90deg, #ff007b, #7928ca);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(255, 0, 123, 0.4);
        }
        .btn-invite {
            background: rgba(36, 16, 56, 0.9);
            color: #ffffff;
            border: 1px solid rgba(255, 42, 133, 0.4);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 99;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-box {
            background: #190a2a;
            border: 1px solid #ff2a85;
            border-radius: 18px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 42, 133, 0.5);
        }
        .modal-box h3 {
            font-size: 17px;
            color: #ff2a85;
            margin-bottom: 8px;
        }
        .modal-box p {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 15px;
        }
        .puzzle-math {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00ffcc;
            margin-bottom: 15px;
        }
        .puzzle-input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #0d0417;
            color: #fff;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }
        .puzzle-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: #ff2a85;
            color: #fff;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PNU NETWORK</h1>
        <p>Decentralized Mobile Mining</p>
    </div>

    <div class="mining-core">
        <div class="outer-ring"></div>
        <div class="glow-circle"></div>
        <svg class="pnu-svg-logo" viewBox="0 0 200 200">
            <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" fill="none" stroke="#ff2a85" stroke-width="8" stroke-linejoin="round"/>
            <polygon points="100,45 150,73 150,127 100,155 50,127 50,73" fill="none" stroke="#ff2a85" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="100" cy="100" r="22" fill="none" stroke="#ffffff" stroke-width="5"/>
            <circle cx="100" cy="45" r="7" fill="#ffffff"/>
            <circle cx="150" cy="73" r="7" fill="#ffffff"/>
            <circle cx="150" cy="127" r="7" fill="#ffffff"/>
            <circle cx="100" cy="155" r="7" fill="#ffffff"/>
            <circle cx="50" cy="127" r="7" fill="#ffffff"/>
            <circle cx="50" cy="73" r="7" fill="#ffffff"/>
            <text x="100" y="106" font-size="14" font-weight="900" fill="#ff2a85" text-anchor="middle">PNU</text>
        </svg>
    </div>
        <!-- Live Balance Card -->
    <div class="balance-board">
        <div class="balance-label">Total Mined PNU</div>
        <div class="balance-num" id="userBalance">0.000282</div>
        <div class="balance-sub">Mining Live • Cloud Active</div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <span>Hashrate</span>
                <strong id="hashrateDisplay">130.00 GH/s</strong>
            </div>
            <div class="stat-card">
                <span>Active Nodes</span>
                <strong>42,891 Online</strong>
            </div>
        </div>
    </div>

    <!-- Global Supply Progress -->
    <div class="progress-box">
        <div class="progress-labels">
            <span>Mined Supply: 486.2M</span>
            <span>Cap: 1000M PNU</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
    </div>

    <!-- Buttons -->
    <div class="action-group">
        <button class="btn btn-boost" onclick="startBoostProcess()">
            ⚡ Boost Mining Speed (+2X)
        </button>
        <button class="btn btn-invite" onclick="triggerTelegramShare()">
            👥 Invite Friends (+50 PNU)
        </button>
    </div>

    <!-- Math Verification Modal -->
    <div class="modal-overlay" id="puzzleModal">
        <div class="modal-box">
            <h3>Human Verification</h3>
            <p>Solve this puzzle to activate 2X Boost Speed</p>
            <div class="puzzle-math" id="puzzleText">14 + 11 = ?</div>
            <input type="number" class="puzzle-input" id="puzzleAnswer" placeholder="Enter answer">
            <button class="puzzle-btn" onclick="verifyMathPuzzle()">Claim 2X Speed</button>
        </div>
    </div>

    <script>
        // Balance Counter Loop
        let baseBalance = parseFloat(localStorage.getItem('pnu_live_balance')) || 0.000282;
        let speedMultiplier = 1;
        const balanceDisplay = document.getElementById('userBalance');

        setInterval(() => {
            baseBalance += 0.000004 * speedMultiplier;
            balanceDisplay.innerText = baseBalance.toFixed(6);
            localStorage.setItem('pnu_live_balance', baseBalance);
        }, 1000);

        // Boost Flow (Ad Redirect + Verification)
        let numA = 0, numB = 0;

        function startBoostProcess() {
            // Monetag / Ad Link
            const directAdLink = "https://omg10.com";
            window.open(directAdLink, '_blank');

            // Show puzzle after ad click
            setTimeout(() => {
                numA = Math.floor(Math.random() * 15) + 5;
                numB = Math.floor(Math.random() * 10) + 1;
                document.getElementById('puzzleText').innerText = `${numA} + ${numB} = ?`;
                document.getElementById('puzzleAnswer').value = '';
                document.getElementById('puzzleModal').style.display = 'flex';
            }, 1500);
        }

        function verifyMathPuzzle() {
            const userAnswer = parseInt(document.getElementById('puzzleAnswer').value);
            if (userAnswer === (numA + numB)) {
                speedMultiplier = 2;
                document.getElementById('hashrateDisplay').innerText = "260.00 GH/s (2X Boost)";
                document.getElementById('puzzleModal').style.display = 'none';
                alert("🎉 Success! 2X Boost has been activated for 1 Hour!");
            } else {
                alert("❌ Wrong Answer! Please try again.");
            }
        }

        // Fixed Telegram Share Function
        function triggerTelegramShare() {
            const shareUrl = "https://t.me" + encodeURIComponent("https://vercel.app") + "&text=" + encodeURIComponent("🚀 Join PNU Network Cloud Mining! Mine free PNU tokens directly on Telegram.");
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openTelegramLink(shareUrl);
            } else {
                window.open(shareUrl, '_blank');
            }
        }

        // Telegram WebApp Setup
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
          </html>
